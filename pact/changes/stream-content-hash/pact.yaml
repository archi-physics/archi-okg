pact_version: 5
id: stream-content-hash
title: content_hash streams cache files instead of reading each one whole
tier: 2
why: >-
  `archi.auth.cache.content_hash` (python/archi/auth/cache.py) hashed each
  cache file with `path.read_bytes()`, so it held the whole file in memory
  on top of the reader's own parsed copy. Cache-backed readers call it for
  every run's revision, and since reference-catalog-complete-scope DBS and
  CondDB call it again for their release-mode checkpoint. A comp-ops DBS
  cache is 719 MB; a DBS run there already failed with
  SourceMemoryLimitExceeded at a 4.6 GB peak, so every extra whole-file
  copy matters.

  Change: read each file in 1 MiB chunks into the same SHA-256 digest. The
  label, the NUL separators and the sorted order are unchanged, so the
  digest is byte-for-byte the old one: stored cursors, revisions and
  content hashes keep their values and nothing re-keys. okg's own
  ContentHashProbe already streams, so the change probe is not affected.
affected_code:
- python/archi/auth/cache.py
- python/tests/auth/test_cache.py
requirements:
- id: req.stream-content-hash.identical
  statement: >-
    content_hash returns exactly the digest of the whole-file algorithm for
    the same inputs, including an empty file, a file of exactly two chunks
    and a multi-MiB file that ends mid-chunk.
- id: req.stream-content-hash.streams
  statement: >-
    content_hash never reads a cache file whole, and its peak traced memory
    on a 50 MiB file stays under 8 MiB.
tasks:
- id: task.stream-content-hash.identical
  requirement: req.stream-content-hash.identical
  verification: >-
    test_streamed_content_hash_equals_the_whole_file_hash in
    python/tests/auth/test_cache.py, which compares against a copy of the
    old algorithm; the existing content_hash tests and the full suite pass.
- id: task.stream-content-hash.streams
  requirement: req.stream-content-hash.streams
  verification: >-
    test_content_hash_never_reads_a_whole_file (Path.read_bytes patched to
    raise) and test_content_hash_peak_memory_stays_far_below_the_file_size
    (tracemalloc) pass, and both fail with the cache.py of 8dbac4c0.
evidence: []
decisions: []
