requirements:
- id: req.twiki-email-redaction.main
  statement: 'Every text field the TWiki sources emit has email addresses removed, and names
    are kept.


    Covered, for both TwikiEOSSource and TwikiCrawlSource and for fixture records: the page
    title, body, author, parent topic, version and date, and so every documentation_page text
    attr (label, title, author, parent_topic, version, last_updated, text) and every document_chunk
    text and heading_path. The chunk reference edges are matched on the redacted chunk text.
    Redaction runs before chunking, so an address that the 4,000-character window would split
    is removed whole.


    Two passes, both removing only the matched token and decoding nothing, so text without
    a match is returned byte-identical and its chunk id does not change:

    - redact_email_addresses (from #5): @, fullwidth @, %40, &#64; and the other forms its
    PACT jira-email-redaction lists, with one change (operator rule item 3, shared with JIRA):
    a token whose separator is a literal @ and whose local part is exactly git, or ends in
    git after a character that cannot be in a name (quote, backtick, |, =, {), is kept
    whole: git@github.com:org/x.git, ssh://git@gitlab.cern.ch:7999/x.git, `git@host:x`. The
    kept token neither hides nor absorbs an address after it (git@github.com:x/y.git by
    jdoe@cern.ch loses only jdoe@cern.ch). john.git@, my-git@, GIT@, git&#64; and git%40
    are still removed. ssh user@host logins are still removed (rule item 4).

    - redact_obfuscated_email_addresses (new): bracketed separators (at) [at] {at} <at> in
    any case, before a dotted domain (., a bracketed (dot) / [DOT], or a spaced dot) whose
    last label is two or more letters; a spaced " at " (any case) before a domain with at
    least one bracketed (dot) / [DOT] (jdoe at cern(dot)ch); glued separators _at_, -at-,
    _AT_ and _NOSPAM_AT_ before exactly cern.ch, fnal.gov or gmail.com (., (dot), _dot_ or
    a spaced DOT as the dot) or a plain-dotted .edu or .gov domain; and a token carrying NOSPAM
    that, with NOSPAM taken out, ends like a mail domain (.ch .edu .gov .org .com, DOTch ...,
    cernch), with a preceding name AT / name_at_ part. Every form needs nothing domain- or
    path-like after it (no letter, digit, - or _, and no . / : @ ( followed by one). Every
    repetition is bounded or unambiguous, so matching is linear.


    Kept (operator rule item 2): free-prose "at ... dot" forms with only . or a spaced dot/DOT
    as the dot, byte for byte, even when they spell an address: john.doe at cern.ch, jdoe
    AT cern DOT ch, jdoe at fnal.gov, "based at cern.ch", Main.JohnDoe at cern.ch.


    Also kept: names (Main.JohnDoe, John Doe, the %META author WikiName, the label of a mailto
    link), prose and file names that use "at" as a word ("run at 13.6 TeV", "x_2016_at_13TeV.root"),
    hosts and paths after a word separator ("served at cmsweb.cern.ch", "at xrootd.t2.ucsd.edu",
    "at cern.ch/cms", "at srm.unl.edu:8443"), a bracketed separator before a number or path
    ("Run2 [at] 13.6TeV"), version pins (numpy@1.26.4), NOSPAM alone or inside a name
    (NoSpamFilter, TWiki.NOSPAMPlugin), and git@ tokens as above.


    Flagged for the operator (not covered by the rule; decided conservatively, i.e. removed):
    the glued john.doe_at_cern.ch form, and NOSPAM tokens, including one after a spaced "name
    AT" (jdoe AT NOSPAMcern.ch loses the whole token). A NOSPAM inserted into a real @ address
    (jdoeNOSPAM@cern.ch, jdoe@NOSPAMcern.ch) is removed by the @ pass.


    Re-emission: both sources'' change probes fingerprint the source class, the twiki module
    and the anonymizer module, so a change to the redaction or to fact building changes the
    probe token.


    Not redacted: the identity fields page_id, source_path, url, web_name and web_root, which
    are derived from the topic path and feed node and record ids. None of the 43,888 snapshot
    file names holds @ or %40.


    Accepted over-removal (fail closed), measured on the snapshot:

    - user@host tokens that are logins, not mail, go as in #5 (operator rule item 4): ssh
    jdoe@lxplus.cern.ch becomes "ssh ", scp f jdoe@lxplus.cern.ch:~/x becomes "scp f :~/x".
    Only the git@ account is exempt.

    - Code shaped like f(at)obj.attr or f(at)x dot product goes.

    - Table pipes and the TWiki ! escape directly before an address go with it (|x@cern.ch|).


    Known gaps:

    - Free-prose spelled-out addresses stay by operator decision (rule item 2), so john.doe
    at cern.ch and jdoe AT cern DOT ch reach the chat. On the snapshot this is the largest
    remaining group (see the real-data receipt).

    - The git@ exemption keeps a real mailbox literally named git@ (git@cern.ch) and a git@
    token that is followed by a dotted local-part run with no separator
    (git@github.com.jdoe@cern.ch keeps jdoe; the #5 behavior also left @cern.ch there).

    - Glued separators before a domain other than cern.ch, fnal.gov, gmail.com, .edu or .gov
    (jdoe_at_infn.it), a bracketed form with doubled spaces or a line break inside it, the
    entity form &lt;at&gt;, spaced dots (cern . ch), fullwidth brackets, and the gaps PACT
    jira-email-redaction lists for the @ pass (including a spaced " &#64; ").


    Acceptance:

    - acc.twiki-email-redaction.fields: a snapshot topic with a distinct address in the author,
    version, parent topic, body plain, mailto link, %40, &#64;, +tag, HTML href and table
    forms and four bracketed, glued or NOSPAM forms emits no fact that contains any of them,
    keeps its two free-prose forms byte for byte, keeps Main.JohnDoe,
    John Doe, Jane Roe and Alice Smith, and redacts the title and body of fixture records
    and the crawl source; an address across a chunk boundary leaves no fragment; the same
    tests fail on main. [evidence: executed_test]

    - acc.twiki-email-redaction.identity: a topic with entities, names, a version pin and
    "at" words but no address is emitted with exactly the parser''s text and the chunk id
    computed from it. [evidence: executed_test]

    - acc.twiki-email-redaction.forms: redact_obfuscated_email_addresses removes each bracketed,
    glued and NOSPAM form, leaves free-prose "at ... dot" forms, hosts, paths, file names and
    NOSPAM alone or in a name byte-identical, and runs in linear time on long runs including
    dot-word chains. [evidence: executed_test]

    - acc.twiki-email-redaction.rule: for each operator rule item there is a test that fails
    at cb610275 or guards the kept behavior: bracketed forms removed (unit and TWiki source);
    free-prose forms byte-identical (unit, and a TWiki topic holding only prose forms and git@
    URLs keeps the parser''s exact text and chunk id); git@ kept, with an address after it
    still removed (unit, TWiki source, and JIRA source); ssh user@host removed (unit, TWiki
    source, and JIRA source). [evidence: executed_test]

    - acc.twiki-email-redaction.reemit: both sources'' change probes fingerprint the twiki
    and anonymizer modules. [evidence: executed_test]'
