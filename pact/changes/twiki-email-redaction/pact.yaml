pact_version: 5
id: twiki-email-redaction
title: Remove email addresses from TWiki text, keep names
tier: 2
why: 'The cms-kb public chat answers from TWiki topics. Both TWiki sources (TwikiEOSSource, the
  EOS snapshot reader behind TwikiEOSAdapter, and TwikiCrawlSource) emit topic text unchanged,
  so contact addresses in topic bodies reach documentation_page attrs and document_chunk text.
  On the cms-kb snapshot (43,888 topic pages), a random sample of 200 pages held 38 addresses
  in 10 pages. Operator decision (Jason, 2026-09-28): "Keep names", remove emails.


  This change removes addresses at emission with redact_email_addresses, the email-only pass
  PR #5 added for the JIRA source, unchanged. It does not call Anonymizer.anonymize, which also
  deletes names, greetings and sign-offs.


  TWiki topics also spell addresses out, which redact_email_addresses does not cover because
  they have no @: jdoe[AT]cern.ch, jdoe(at)cern(dot)ch, john.doe at cern.ch, john.doe_at_cern.ch,
  jdoe AT cern DOT ch, and NOSPAM insertions. Over 1,261 candidate topics on the snapshot these
  were 37 bracketed, about 134 word-separator and 8 NOSPAM addresses that the @ pass left in.
  This change adds redact_obfuscated_email_addresses next to it in archi.enrichment.anonymizer
  and calls it from the TWiki sources only; the JIRA source is unchanged.


  CARRIED SIDE EFFECT, as in #5: on the next ingest, chunks whose text held an address get new
  chunk ids (the chunk id hashes the chunk text), and a page whose author, parent topic or
  version held an address gets new attrs. Chunks and pages without an address keep their ids
  and text byte for byte.'
affected_code:
- python/archi/sources/twiki.py
- python/archi/enrichment/anonymizer.py
- python/tests/sources/test_twiki.py
- python/tests/enrichment/test_anonymizer.py
requirements:
- id: req.twiki-email-redaction.main
  statement: 'Every text field the TWiki sources emit has email addresses removed, and names
    are kept.


    Covered, for both TwikiEOSSource and TwikiCrawlSource and for fixture records: the page
    title, body, author, parent topic, version and date, and so every documentation_page text
    attr (label, title, author, parent_topic, version, last_updated, text) and every
    document_chunk text and heading_path. The chunk reference edges are matched on the redacted
    chunk text. Redaction runs before chunking, so an address that the 4,000-character window
    would split is removed whole.


    Two passes, both removing only the matched token and decoding nothing, so text without a
    match is returned byte-identical and its chunk id does not change:

    - redact_email_addresses (from #5, unchanged): @, fullwidth @, %40, &#64; and the other
    forms its PACT jira-email-redaction lists.

    - redact_obfuscated_email_addresses (new): bracketed separators (at) [at] {at} <at> in any
    case with any dotted domain ending in a label with a letter, and (dot) dots; word separators
    " at ", " AT ", _at_, -at-, _AT_ and _NOSPAM_AT_ only before a mail domain -- exactly cern.ch,
    fnal.gov or gmail.com, or a domain ending in .edu, with . or DOT/dot/(dot) as the dot and
    nothing domain-like after it; and any token that carries NOSPAM plus at least two other
    letters or digits.


    Kept: names (Main.JohnDoe, John Doe, the %META author WikiName, the label of a mailto link),
    prose and file names that use "at" as a word ("run at 13.6 TeV", "x_2016_at_13TeV.root"),
    hosts after a word separator ("served at cmsweb.cern.ch"), version pins (numpy@1.26.4) and
    NOSPAM on its own.


    Not redacted: the identity fields page_id, source_path, url, web_name and web_root, which
    are derived from the topic path and feed node and record ids. None of the 43,888 snapshot
    file names holds @ or %40.


    Accepted over-removal (fail closed), measured on the snapshot:

    - user@host tokens that are logins, not mail, go as in #5: in a 200-page sample of
    address-bearing topics, 91 of 586 removals were ssh user@lxplus..., git@github.com:org/x or
    similar, so "git clone git@github.com:cms-sw/x.git" becomes "git clone :cms-sw/x.git".

    - One word before " at cern.ch" goes even when it is prose ("based at cern.ch").

    - Table pipes and the TWiki ! escape directly before an address go with it (|x@cern.ch|).


    Known gaps: word-separator forms with other domains (jdoe at ucsd.edu is removed, but jdoe
    at infn.it or jdoe AT jwood.cern.ch are not), and the gaps PACT jira-email-redaction lists
    for the @ pass.


    Acceptance:

    - acc.twiki-email-redaction.fields: a snapshot topic with a distinct address in the author,
    version, parent topic, body plain, mailto link, %40, &#64;, +tag, HTML href and table forms
    and six spelled-out forms emits no fact that contains any of them, keeps Main.JohnDoe,
    John Doe, Jane Roe and Alice Smith, and redacts the title and body of fixture records and
    the crawl source; an address across a chunk boundary leaves no fragment; the same tests
    fail on main. [evidence: executed_test]

    - acc.twiki-email-redaction.identity: a topic with entities, names, a version pin and "at"
    words but no address is emitted with exactly the parser''s text and the chunk id computed
    from it. [evidence: executed_test]

    - acc.twiki-email-redaction.forms: redact_obfuscated_email_addresses removes each spelled-out
    form, leaves prose, hosts, file names and NOSPAM alone byte-identical, and runs in linear
    time on long runs. [evidence: executed_test]'
