requirements:
- id: req.reference-catalog-complete-scope.release-modes
  statement: cmssw, conddb, dbs and github_repos claim a complete scope over a valid input
    in run modes `release_new` and `release_unchanged`, and still claim none in `cursor`.
- id: req.reference-catalog-complete-scope.guards-kept
  statement: 'In `release_new` and `release_unchanged` the guards withhold the claim: skipped
    cache items (cmssw, conddb, dbs), an empty cache (cmssw, conddb, dbs), a truncated release
    list (cmssw), and no valid repository slug (github_repos, new).'
- id: req.reference-catalog-complete-scope.okg-parity
  statement: No connector imports okg.substrate; archi's COMPLETED_SCOPE_RUN_MODES equals
    okg's set at the pinned okg commit, checked by a test.
- id: req.reference-catalog-complete-scope.alignment
  statement: docs/okg-alignment.md records the change in "Current state", including that deletion
    by absence is now live and the planned switch to the okg.deployment export; its import
    block is unchanged and test_alignment_page.py passes.
