pact_version: 5
id: reference-catalog-complete-scope
title: Reference-catalog readers claim a complete scope in okg's release run modes
tier: 2
why: 'okg commit d84f8fd275 ("Resolve source run modes from one per-profile policy", 2026-09-26,
  contained in the pinned ac078aabd) runs every `source_class: reference_catalog` source in
  run mode `release_new` (its whole-scope mode) or `release_unchanged`, and both complete
  the scope (okg src/okg/substrate/source_run_modes.py, PROFILE_RUN_MODES and COMPLETED_SCOPE_RUN_MODES).
  The four archi reference-catalog readers -- cmssw, conddb, dbs and github_repos -- decided
  the claim with their own copy of the mode set, `{"scope_complete", "reconcile"}`, which
  okg no longer passes them. So they never claimed a complete scope, and okg admission refused
  every later run that emitted nothing new as `partial`, which blocked publishing. A downstream
  CMS instance turned its CMSSW releases source off on 2026-10-01 because of it.

  DECISION (Jason, `cmsswfix A`): the four readers read the set from okg''s COMPLETED_SCOPE_RUN_MODES
  instead of keeping a copy, so the next change to okg''s policy cannot leave them behind
  again. The import has no fallback literal: if okg stops providing it, the reader fails at
  import. The set is a superset of the old one, so scope_complete and reconcile behave as
  before. The skip, truncation and empty-cache guards are unchanged. The okg pin does not
  change.

  NOT CHANGED: the other readers with the same hard-coded set are discovery_crawl (cds, cric,
  docs, dqm, gocdb, hypernews, indico, indico_live, siteconf, twiki) or mutable_api (jira,
  monit, wmstats). okg''s completing modes for those profiles are scope_complete and reconcile,
  which the hard-coded set already covers, so they are not affected.'
