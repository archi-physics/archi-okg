pact_version: 5
id: reference-catalog-complete-scope
title: Reference-catalog readers claim a complete scope in okg's release run modes
tier: 2
why: 'okg commit d84f8fd275 ("Resolve source run modes from one per-profile policy", 2026-09-26,
  contained in the pinned ac078aabd) runs every `source_class: reference_catalog` source in
  run mode `release_new`, which it picks automatically; `release_unchanged` comes only from
  an explicit mode setting. Both complete the scope (okg src/okg/substrate/source_run_modes.py,
  COMPLETED_SCOPE_RUN_MODES). The four archi reference-catalog readers -- cmssw, conddb, dbs
  and github_repos -- decided the claim with their own copy of the mode set, `{"scope_complete",
  "reconcile"}`, which okg no longer passes them. So they never claimed a complete scope,
  and okg admission refused every later run that emitted nothing new as `partial`, which blocked
  publishing. A downstream CMS instance turned its CMSSW releases source off on 2026-10-01
  because of it.

  DECISION (Jason, `cmsswfix A`; refined by the lane lead after review, option b): the four
  readers share one archi copy of okg''s scope-completing modes, archi.sources._run_modes.COMPLETED_SCOPE_RUN_MODES
  = {scope_complete, reconcile, release_new, release_unchanged}. They do not import okg.substrate.source_run_modes
  because `okg lint deployments` reports DEPLOYMENT-001 for any okg.substrate import in a
  connector, and okg-deployments'' compatibility CI marks such a deployment incompatible.
  A test asserts the copy equals okg''s set (from okg.deployment when the pinned okg exports
  it, else from okg.substrate.source_run_modes), so a pin bump that changes okg''s policy
  fails the suite. The readers should switch to the okg.deployment export once the pin passes
  okg branch claude/connector-complete-scope-modes. The set is a superset of the old one,
  so scope_complete and reconcile behave as before. The skip, truncation and empty-cache guards
  are unchanged. The okg pin does not change.

  Deletion by absence becomes live for these four sources: each declares deletion_semantics
  missing_from_completed_scope, so a release_new run over a valid input retracts what is no
  longer in it, and a refreshed DBS or CondDB cache with a different selection deletes what
  dropped out. Before d84f8fd275 such a retraction failed the run (the runner had no retraction
  policy for reference_catalog under scope_complete); since then the readers never claimed
  a complete scope. So github_repos, which had no empty-input guard, gains `and bool(records)`
  like cmssw: an all-invalid slug list must not retract every repository. In release_unchanged
  a catalog that shrank now fails the run loudly, because okg refuses retractions in that
  mode.

  NOT CHANGED: the other readers with the same hard-coded set are discovery_crawl (cds, cric,
  docs, dqm, gocdb, hypernews, indico, indico_live, siteconf, twiki) or mutable_api (jira,
  monit, wmstats). okg''s completing modes for those profiles are scope_complete and reconcile,
  which the hard-coded set already covers, so they are not affected.'
