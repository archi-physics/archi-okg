- id: req.reference-catalog-complete-scope.release-modes
  statement: cmssw, conddb, dbs and github_repos claim a complete scope over a valid input
    in run modes `release_new` and `release_unchanged`, and still claim none in `cursor`.
- id: req.reference-catalog-complete-scope.guards-kept
  statement: 'In `release_new` and `release_unchanged` the existing guards still withhold
    the claim: skipped cache items (cmssw, conddb, dbs), an empty cache (cmssw, conddb, dbs)
    and a truncated release list (cmssw).'
- id: req.reference-catalog-complete-scope.alignment
  statement: docs/okg-alignment.md lists the new okg import in its import block and records
    the change in "Current state"; test_alignment_page.py passes.
