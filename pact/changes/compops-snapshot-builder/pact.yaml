requirements:
- id: req.compops-snapshot-builder.downloaders
  statement: 'The JIRA, static-docs and SSO-login downloaders and the source download manifest
    run from archi-okg as python -m archi.downloaders.{jira,static_docs,sso_login}, import
    nothing from okg, and write caches the archi readers accept. Default output paths follow
    ARCHI_DATA_ROOT (data/jira, data/gitlab-docs, data/docsite) and cookie files go to
    --cookie-dir, else ARCHI_COOKIE_DIR, else ./.cookies. Record shapes and the login flow are
    unchanged from okg-deployments main 32f2b4e3c2.


    Acceptance:

    - acc.compops-snapshot-builder.jira-download: with a fake jira client, the downloader pages
    through issues, writes records.json and meta.json, and the archi JIRA reader reads the cache
    with a completed scope; a missing token or a missing jira package stops with a named message.
    [evidence: executed_test]

    - acc.compops-snapshot-builder.docs-download: with a fake HTTP session, the static-docs
    downloader writes GitLab and public-page caches that the archi documentation reader reads
    with a completed scope, merges by URL, and tries a GitLab token before anonymous access.
    [evidence: executed_test]

    - acc.compops-snapshot-builder.sso: cookie files keep only service and SSO-domain cookies,
    are mode 0600 and readable by archi.auth.cookies; --check without cookie files exits 1.
    [evidence: executed_test]'
- id: req.compops-snapshot-builder.snapshot
  statement: 'python -m archi.snapshot build takes a config mapping each group to its cache
    directory and a required collection date (YYYY-MM-DD or a YYYY-MM-DD..YYYY-MM-DD range),
    so one snapshot can mix collection dates. For each group it refuses, with an error naming
    the group, file and record, any missing file, invalid JSON, wrong shape or record the reader
    would skip or drop; removes every email address from every string with redact_email_addresses;
    drops every field the reader does not read plus the configured drop_fields (WMStats always
    drops RequestorDN and keeps Requestor); and runs the group''s archi reader, which must report
    health ok, a completed scope, and the same facts as from the unpruned cache. If any group is
    refused nothing is written. Otherwise it writes one deterministic tar.zst per group and
    snapshot.lock.yaml with each group''s collection date, SHA-256, size, file count, record count
    and contents digest. python -m archi.snapshot verify checks archives against a lock.


    Acceptance:

    - acc.compops-snapshot-builder.malformed: a malformed record in any of 11 JSON groups refuses
    exactly that group and writes nothing. [evidence: executed_test]

    - acc.compops-snapshot-builder.addresses: a planted address in each of the 12 text-bearing
    groups is absent from every archive. [evidence: executed_test]

    - acc.compops-snapshot-builder.jira-facts: the archi JIRA reader emits the same facts from a
    raw JIRA fixture and from the snapshot''s redacted copy. [evidence: executed_test]

    - acc.compops-snapshot-builder.deterministic: two builds give byte-identical archives.
    [evidence: executed_test]

    - acc.compops-snapshot-builder.verify: verify fails, naming the group, on one flipped byte.
    [evidence: executed_test]

    - acc.compops-snapshot-builder.requestor-dn: the WMStats DN never appears in the output, even
    when a config asks to keep it; Requestor is kept. [evidence: executed_test]'
tasks:
- id: task.compops-snapshot-builder.downloaders
  requirement: req.compops-snapshot-builder.downloaders
  verification: 'Copy the three scripts and the manifest verbatim in one commit, adapt them in
    the next, and test them offline.


    Proof: the downloader tests fail against the verbatim copies and pass with the change.


    Test plan:

    - python/tests/downloaders [evidence: pytest]'
- id: task.compops-snapshot-builder.snapshot
  requirement: req.compops-snapshot-builder.snapshot
  verification: 'Add archi.snapshot and its tests on synthetic fixtures only.


    Proof: every snapshot test passes; disabling each safeguard in turn (redaction, pruning,
    the record check, the fixed mtime, member sorting, the verify SHA-256 check, the reader
    fact comparison, the WMStats DN drop) makes at least one test fail; the full archi suite
    passes.


    Test plan:

    - python/tests/snapshot [evidence: pytest]

    - python/tests [evidence: pytest]'
