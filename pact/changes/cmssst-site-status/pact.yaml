- python/tests/fixtures/cmssst/T2_CH_CERN.json
requirements:
- id: req.cmssst-site-status.download
  statement: 'A downloader, `python -m archi.downloaders.cmssst`, fetches summary.js, parses
    its site list, fetches each site''s JSON and writes data/cmssst-site-status/records.json
    under ARCHI_DATA_ROOT: a JSON list, one object per site, holding the site-level fields
    the reader reads (site, time, alert, msg, ggus, metrics) and not the per-host `elements`
    list. It uses no credentials and a bounded per-request timeout. It fails loudly and writes
    nothing when summary.js has no site list or an invalid site name, when any site fetch
    fails or returns an error-shaped body, or when the result would be empty: the reader claims
    a complete scope, so a partial cache would retract the missing sites.'
- id: req.cmssst-site-status.reader
  statement: A reader `archi.sources.cmssst.CMSSSTSiteStatusSource` (adapter `CMSSSTSiteStatusAdapter`)
    emits, per site, one documentation_page whose url is https://cmssst.web.cern.ch/siteStatus/detail.html?site=<SITE>
    and whose title is "<SITE> site status", plus document_chunk nodes joined by `contains`
    edges. The page text states, in plain words from the page's own legend, the status at
    the snapshot time of Life, Prod, CRAB and Rucio status and their manual overrides, Site
    Readiness, SAM, FTS, HammerCloud, Downtime and Summary; the open GGUS ticket ids; and
    the snapshot time. Record identity is the site name, the revision is the cache content
    hash, and deletion is missing_from_completed_scope. A missing, empty, truncated or error-shaped
    cache gives no facts and no complete scope (cache_missing / endpoint_failed) in preflight
    and run alike; a malformed record is skipped and stops the scope claim. With an optional
    CRIC sites cache configured, the page `references` the matching `site` node, and only
    when that cache lists the site.
- id: req.cmssst-site-status.snapshot
  statement: archi.snapshot knows a `cmssst-site-status` group (data/cmssst-site-status, records.json,
    a list) whose schema keeps every field the reader reads, whose identity check refuses
    a record without a CMS site name, and which the existing snapshot builder tests (every
    group built, addresses removed, malformed record refused, byte-identical rebuild) cover.
tasks:
- id: task.cmssst-site-status.download
  requirement: req.cmssst-site-status.download
  verification: python/tests/downloaders/test_downloader_cmssst.py passes with no network
    (fetches are injected), against the real summary.js sample (91 sites) and real site JSON
    samples, including the failure cases (no site list, bad site name, error-shaped site body,
    a failed fetch, empty result) writing nothing.
- id: task.cmssst-site-status.reader
  requirement: req.cmssst-site-status.reader
  verification: python/tests/sources/test_cmssst.py passes against the real T1_US_FNAL, T2_US_MIT
    and T2_CH_CERN samples (decoded words, URL, title, GGUS ids, identity stable across a
    content change, site edge only to a known site) and the empty, malformed and error-shaped
    cache refusals; the bundle adapter and full archi suite stay green.
- id: task.cmssst-site-status.snapshot
  requirement: req.cmssst-site-status.snapshot
  verification: python/tests/snapshot/test_snapshot_builder.py passes with the new group in
    its fixture, its planted address and its malformed-record case.
