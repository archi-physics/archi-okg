requirements:
- id: req.jira-comment-records.main
  statement: 'With comment_records on, JiraIssueSource emits each comment of an issue as a
    jira_comment record with a stable content-hash id, linked to its issue and its author and
    carrying the issue''s lineage; the issue chunks stay byte-identical; with the option off the
    source emits no comment record, edge or count.


    Acceptance:

    - acc.jira-comment-records.records: An issue with three comments, two of them identical, gives
    three jira_comment ids with -1 on the repeat, three has_comment edges in source order and
    three authored_by edges; each id is the hash of created, author and the stripped body; each
    comment''s source record id names its issue key and its project is the issue''s; comment_count
    counts the records; with the option off none of this is emitted and the probe token is
    unchanged. [evidence: executed_test]

    - acc.jira-comment-records.schema: okg composes JiraComment, jira_issue has_comment
    jira_comment and jira_comment authored_by person from both schema copies; every emitted
    attribute is declared; okg_record_parts names only declared attributes. [evidence:
    executed_test]

    - acc.jira-comment-records.chunks-identical: Over a real JIRA records snapshot, every
    document_chunk, contains and references fact from this branch with comment_records on equals
    main''s adapter''s, in the same order, and the jira_comment count equals the number of
    non-empty comments in the snapshot. [evidence: executed_test]'
